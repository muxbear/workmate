# WorkMate 项目级 Codex 配置
# 文档：https://developers.openai.com/codex/guides/config

# ── 模型 ─────────────────────────────────────────────
# 继承全局配置的 model / model_provider，此处不重复设置。
# 如需为该项目切换模型，取消注释并修改：
model = "volc/glm-5.2"
# model_provider = "asiainfo" # 项目级配置文件不支持这个 Key

# 推理强度：high 适合多子项目、多语言的复杂任务
model_reasoning_effort = "high"

# ── 沙箱 ─────────────────────────────────────────────
# workspace-write：允许读写项目目录，适合日常开发
sandbox_mode = "workspace-write"

# ── 环境变量策略 ─────────────────────────────────────
# 继承全部环境变量，确保 Node.js、Python、uv 等工具链可用
[shell_environment_policy]
inherit = "all"

# ── 功能开关 ─────────────────────────────────────────
# 按需开启实验性功能，不需要的保持注释即可
# [features]
# ambient_suggestions = true
